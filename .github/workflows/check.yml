name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, tests, web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated catalogs are up to date
        run: |
          npm run generate:ai-catalogs
          git diff --exit-code -- lib/generated data/generated supabase/functions

  functions:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >
          deno check
          supabase/functions/analyze-photo-labels/index.ts
          supabase/functions/rewrite-email/index.ts
